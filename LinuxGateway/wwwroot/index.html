<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unity Build Linux Gateway</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app">
    <section id="loginView" class="login">
      <form id="loginForm" class="panel">
        <h1>Unity Build Gateway</h1>
        <label>账号<input id="loginUser" autocomplete="username" value="admin"></label>
        <label>密码<input id="loginPassword" type="password" autocomplete="current-password" placeholder="查看 linuxgateway-data/initial-admin.txt"></label>
        <button type="submit">登录</button>
        <p id="loginError" class="error"></p>
      </form>
    </section>

    <section id="mainView" class="hidden">
      <header class="topbar">
        <div>
          <h1>Unity Build Gateway</h1>
          <p>统一入口只负责调度，真正打包仍在 Mac / Windows 节点执行。</p>
        </div>
        <button id="logoutBtn" type="button">退出</button>
      </header>

      <div id="globalError" class="error banner hidden"></div>

      <section class="layout">
        <aside class="panel sidebar">
          <h2>设备</h2>
          <div id="nodesList" class="list"></div>
          <button id="refreshBtn" type="button">刷新设备</button>
        </aside>

        <section class="content">
          <div class="grid">
            <form id="nodeForm" class="panel">
              <h2>新增 / 更新设备</h2>
              <label>设备 ID<input id="nodeId" placeholder="新增时留空；更新时填写已有 ID"></label>
              <label>设备名称<input id="nodeName" placeholder="Mac Build / Windows Android"></label>
              <label>BuildServer 地址<input id="nodeBaseUrl" placeholder="https://mac-build.example.com"></label>
              <label>Gateway Token<input id="nodeToken" type="password" placeholder="Mac/Windows 的 BUILD_SERVER_GATEWAY_TOKEN"></label>
              <div class="checks">
                <label><input id="nodeIos" type="checkbox"> iOS</label>
                <label><input id="nodeAndroid" type="checkbox"> Android</label>
                <label><input id="nodeEnabled" type="checkbox" checked> 启用</label>
              </div>
              <button type="submit">保存设备</button>
            </form>

            <form id="buildForm" class="panel">
              <h2>发起打包</h2>
              <label>目标设备<select id="buildNode"></select></label>
              <label>项目<select id="buildProject"></select></label>
              <label>配置<select id="buildConfig"></select></label>
              <label>分支<input id="buildBranch" placeholder="留空使用项目默认分支"></label>
              <label>Build Number<input id="buildNumber" placeholder="留空自动递增"></label>
              <div class="checks">
                <label><input id="dryRun" type="checkbox" checked> dry-run</label>
                <label><input id="skipGit" type="checkbox"> 跳过 Git</label>
                <label><input id="skipUnity" type="checkbox"> 跳过 Unity</label>
                <label><input id="skipXcode" type="checkbox"> 跳过 Xcode（iOS）</label>
                <label><input id="allowNonMac" type="checkbox"> 允许非 Mac 调试</label>
              </div>
              <label>备注<textarea id="buildNotes" rows="3"></textarea></label>
              <button type="submit">提交到选中设备</button>
            </form>
          </div>

          <section class="panel">
            <h2>任务</h2>
            <div id="jobsList" class="list"></div>
          </section>

          <section id="jobDetail" class="panel hidden">
            <header class="section-head">
              <h2 id="jobTitle">任务详情</h2>
              <button id="refreshJobBtn" type="button">刷新任务</button>
            </header>
            <div id="jobMeta" class="meta"></div>
            <h3>产物</h3>
            <div id="artifactsList" class="list"></div>
            <h3>日志</h3>
            <pre id="jobLog"></pre>
          </section>
        </section>
      </section>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
